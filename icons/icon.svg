<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14263f"/>
      <stop offset="0.55" stop-color="#6b5b6e"/>
      <stop offset="1" stop-color="#e59a52"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff1c2"/>
      <stop offset="1" stop-color="#ffb84d"/>
    </radialGradient>
  </defs>
  <!-- sky (full bleed so it works as a maskable icon) -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="256" cy="220" r="84" fill="url(#sun)"/>
  <!-- haze bands drifting across the sun -->
  <rect x="64" y="186" width="384" height="24" rx="12" fill="#ffffff" opacity="0.55"/>
  <rect x="112" y="228" width="320" height="24" rx="12" fill="#ffffff" opacity="0.5"/>
  <rect x="80" y="270" width="352" height="24" rx="12" fill="#ffffff" opacity="0.42"/>
  <!-- skyline -->
  <g fill="#10192b">
    <rect x="0" y="420" width="512" height="92"/>
    <rect x="150" y="372" width="34" height="60"/>
    <rect x="190" y="352" width="28" height="80"/>
    <rect x="224" y="380" width="30" height="52"/>
    <rect x="262" y="364" width="26" height="68"/>
    <rect x="294" y="384" width="34" height="48"/>
    <rect x="334" y="368" width="28" height="64"/>
  </g>
</svg>
